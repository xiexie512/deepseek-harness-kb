<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>移动端 H5 参考 · 设计质量系统</title>
<style>
  :root{
    --brand-50:#f5f7fb; --brand-100:#e8edf7; --brand-500:#2563eb; --brand-600:#144cc6;
    --n-50:#fafafb; --n-100:#f4f5f6; --n-200:#e7e8eb; --n-300:#d0d2d8; --n-500:#828897;
    --n-600:#616775; --n-700:#464a53; --n-900:#1a1b1e;
    --ok:#15803d; --ok-bg:#f0fdf4; --warn:#b45309; --warn-bg:#fffbeb; --err:#b91c1c; --err-bg:#fef2f2;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px;
    --t-xs:12px; --t-sm:14px; --t-base:16px; --t-lg:18px; --t-xl:20px; --t-2xl:24px; --t-3xl:30px;
    --r-sm:4px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-full:999px;
    --sh1:0 1px 2px rgb(15 23 42/.06),0 1px 1px rgb(15 23 42/.04);
    --ease:cubic-bezier(.2,0,0,1); --dur:200ms;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--n-100);color:var(--n-900);
    font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none}

  /* 手机壳：桌面预览时给 420 上限，真机自动铺满 */
  .phone{max-width:420px;margin:0 auto;min-height:100vh;background:#fff;position:relative;
    display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  :focus-visible{outline:2px solid var(--brand-500);outline-offset:2px}

  /* 顶部：返回 + 大标题，不做三行堆叠 */
  .appbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--n-200);display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4)}
  .back{width:32px;height:32px;display:grid;place-items:center;border:0;background:transparent;
    color:var(--n-700);font-size:var(--t-lg);cursor:pointer;border-radius:var(--r-full)}
  .appbar b{font-size:var(--t-base);font-weight:600}

  main{padding:var(--s6) var(--s4) var(--s8);display:grid;gap:var(--s6);flex:1}
  .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3)}
  h1{margin:0;font-size:var(--t-2xl);line-height:1.25;letter-spacing:-.02em;font-weight:600}
  .hd .cnt{font-size:var(--t-sm);color:var(--n-500)}
  .lede{margin:var(--s1) 0 0;font-size:var(--t-sm);color:var(--n-500)}

  /* 搜索：一行、可点、不必展开 */
  .search{display:flex;align-items:center;gap:var(--s2);height:44px;padding:0 var(--s4);
    background:var(--n-100);border-radius:var(--r-lg);color:var(--n-500);font-size:var(--t-sm)}

  /* 分段筛选 */
  .seg{display:flex;gap:var(--s1);padding:var(--s1);background:var(--n-100);border-radius:var(--r-lg)}
  .seg button{flex:1;height:36px;border:0;border-radius:var(--r-md);background:transparent;
    color:var(--n-600);font-size:var(--t-sm);cursor:pointer;transition:background var(--dur) var(--ease)}
  .seg button[aria-pressed="true"]{background:#fff;color:var(--n-900);font-weight:500;box-shadow:var(--sh1)}

  /* 卡片列表：一屏一条主任务，右箭头暗示可点 */
  .list{display:grid;gap:var(--s3)}
  .item{display:flex;gap:var(--s3);align-items:flex-start;background:#fff;border:1px solid var(--n-200);
    border-radius:var(--r-xl);padding:var(--s4);text-decoration:none;color:inherit;
    transition:background var(--dur) var(--ease)}
  .item:active{background:var(--n-50)}
  .thumb{width:40px;height:40px;border-radius:var(--r-md);background:var(--brand-50);color:var(--brand-600);
    display:grid;place-items:center;font-size:var(--t-sm);font-weight:600;flex:none}
  .body{min-width:0;flex:1;display:grid;gap:var(--s1)}
  .body b{font-size:var(--t-base);font-weight:600;letter-spacing:-.01em}
  .body p{margin:0;font-size:var(--t-sm);color:var(--n-600);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{display:flex;gap:var(--s2);align-items:center;font-size:var(--t-xs);color:var(--n-500);margin-top:var(--s1)}
  .tag{display:inline-flex;align-items:center;height:24px;padding:0 var(--s2);border-radius:var(--r-sm);font-size:var(--t-xs);font-weight:500}
  .t-warn{background:var(--warn-bg);color:var(--warn)}
  .t-ok{background:var(--ok-bg);color:var(--ok)}
  .t-err{background:var(--err-bg);color:var(--err)}

  /* 底部主操作 + Tab，都避开 Home Indicator */
  .dock{position:sticky;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
    border-top:1px solid var(--n-200);padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom))}
  .primary{width:100%;height:48px;border:0;border-radius:var(--r-lg);background:var(--brand-600);color:#fff;
    font-size:var(--t-base);font-weight:500;cursor:pointer;margin-bottom:var(--s3)}
  .primary:active{background:#1b4295}
  .tabs{display:flex;justify-content:space-around}
  .tab{display:grid;justify-items:center;gap:var(--s1);border:0;background:none;cursor:pointer;
    color:var(--n-500);font-size:var(--t-xs);padding:var(--s1) var(--s3);min-width:44px;min-height:44px}
  .tab[aria-current]{color:var(--brand-600);font-weight:500}
  .tab .g{font-size:var(--t-lg);line-height:1}

  @media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="phone">

  <div class="appbar">
    <button class="back" type="button" aria-label="返回上一页">‹</button>
    <b>我的工单</b>
  </div>

  <main>
    <div>
      <div class="hd">
        <h1>待处理</h1>
        <span class="cnt">12 条</span>
      </div>
      <p class="lede">按 SLA 剩余时间排序</p>
    </div>

    <div class="search" role="search"><span aria-hidden="true">⌕</span>搜索编号、客户或关键词</div>

    <div class="seg" role="group" aria-label="筛选">
      <button type="button" aria-pressed="true">全部</button>
      <button type="button" aria-pressed="false">我的</button>
      <button type="button" aria-pressed="false">已升级</button>
    </div>

    <div class="list">
      <a class="item" href="#1042">
        <span class="thumb" aria-hidden="true">支</span>
        <span class="body">
          <b>支付回调超时</b>
          <p>客户支付成功但未收到回调，已等待 2 小时，接近 SLA 上限。</p>
          <span class="meta"><span class="tag t-err">剩余 30 分钟</span><span>#1042</span><span>青柚科技</span></span>
        </span>
      </a>
      <a class="item" href="#1041">
        <span class="thumb" aria-hidden="true">账</span>
        <span class="body">
          <b>账号无法登录</b>
          <p>密码正确但提示会话过期，疑似 Cookie 策略变更。</p>
          <span class="meta"><span class="tag t-warn">剩余 4 小时</span><span>#1041</span><span>远景数据</span></span>
        </span>
      </a>
      <a class="item" href="#1040">
        <span class="thumb" aria-hidden="true">票</span>
        <span class="body">
          <b>发票抬头修改</b>
          <p>客户提供新抬头，需要重开并作废原票。</p>
          <span class="meta"><span class="tag t-ok">今天内</span><span>#1040</span><span>海图物流</span></span>
        </span>
      </a>
    </div>
  </main>

  <div class="dock">
    <button class="primary" type="button">新建工单</button>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-current="page" type="button"><span class="g" aria-hidden="true">▤</span>工单</button>
      <button class="tab" role="tab" type="button"><span class="g" aria-hidden="true">◍</span>客户</button>
      <button class="tab" role="tab" type="button"><span class="g" aria-hidden="true">⌕</span>搜索</button>
      <button class="tab" role="tab" type="button"><span class="g" aria-hidden="true">◔</span>我的</button>
    </div>
  </div>
</div>
</body>
</html>
